# beer-api: read-only DuckDB query API for the per-recipe views.
#
# Run from the repo root — paths are repo-relative, so no `cd` juggling:
#
#   docker network create apis                       # shared network, one time
#   npm --prefix apps/beer-api ci
#   npm --prefix apps/beer-api run build:db          # -> ./data/{beer.duckdb,aggregates.json}
#   docker compose up -d --build
#
# The container mounts the repo's single canonical data dir (./data) — the same
# one the build pipeline and build:db write to, not a second copy nested under
# the app. On a host that doesn't hold the repo (e.g. the cluster, where you
# rsync just the DB), point the mount at wherever the files landed:
#
#   DATA_DIR=/srv/beer docker compose up -d
#
# To publish a fresh crawl: rebuild the data, then `docker compose restart
# beer-api` (the DB file is swapped; the container reopens it read-only).
#
# cloudflared (the public entry point) is separate shared infra — bring it up
# once from infra/cloudflared/; it fronts this and any other app on the network.

services:
  beer-api:
    build: ./apps/beer-api
    image: beer-api:latest
    container_name: beer-api
    restart: unless-stopped
    environment:
      # "/beer" behind cloudflared path routing; set to "" if you give it its
      # own subdomain instead.
      BASE_PATH: /beer
      PORT: "8080"
      DB_PATH: /data/beer.duckdb
      AGG_PATH: /data/aggregates.json
      # Lock CORS to your frontend origin(s) in production, comma-separated.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      # Repo's single canonical data dir → /data (read-only). Override with an
      # absolute host path on machines that don't hold the repo: DATA_DIR=/srv/beer.
      - ${DATA_DIR:-./data}:/data:ro
    networks:
      apis:
        aliases:
          - beer-api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080'+(process.env.BASE_PATH||'')+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Create once on the host:  docker network create apis
  apis:
    external: true
